<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Dedupe — Revisor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>🗂️ Media Dedupe</h1>
    <nav class="tabs">
      <button class="tab active" data-view="resultados">Resultados</button>
      <button class="tab" data-view="operacion">Operación</button>
    </nav>
    <div class="topbar-actions">
      <button id="btn-recargar" title="Recargar reporte">↻ Recargar</button>
    </div>
  </header>

  <!-- ── VISTA RESULTADOS ─────────────────────────────────────────── -->
  <main id="view-resultados" class="view active">
    <aside class="sidebar">
      <div class="filtros">
        <div class="resumen" id="resumen">Sin reporte cargado.</div>
        <label>Similitud mínima: <span id="umbral-val">0</span>%
          <input type="range" id="f-umbral" min="0" max="100" value="0">
        </label>
        <label>Tipo
          <select id="f-tipo">
            <option value="">Todos</option>
            <option value="exact">Duplicado exacto</option>
            <option value="image_similar">Imágenes similares</option>
            <option value="video_similar">Videos similares</option>
          </select>
        </label>
        <label>Proveedor
          <select id="f-proveedor"><option value="">Todos</option></select>
        </label>
      </div>
      <ul class="lista-grupos" id="lista-grupos"></ul>
      <div class="sel-contador" id="sel-contador">
        <div class="sel-num"><strong id="sel-count">0</strong> archivos seleccionados</div>
        <div class="sel-mb"><strong id="sel-size">0 B</strong> recuperables</div>
        <button id="btn-cuarentena-sidebar" class="peligro" disabled>Enviar a cuarentena</button>
      </div>
    </aside>

    <section class="detalle" id="detalle">
      <div class="placeholder" id="detalle-placeholder">
        Selecciona un grupo de la izquierda para comparar los archivos.
      </div>
      <div class="detalle-header" id="detalle-header" hidden>
        <div id="detalle-titulo"></div>
        <button id="btn-cuarentena" class="peligro">Enviar seleccionados a cuarentena</button>
      </div>
      <div class="comparativa" id="comparativa"></div>
    </section>
  </main>

  <!-- ── VISTA OPERACIÓN ──────────────────────────────────────────── -->
  <main id="view-operacion" class="view">
    <section class="panel-op">
      <h2>Escanear</h2>
      <label>Carpetas locales (una por línea)
        <textarea id="op-local" rows="3" placeholder="C:\Fotos&#10;D:\Backup\Fotos"></textarea>
      </label>
      <div class="fila">
        <label>Modo de hash
          <select id="op-hash">
            <option value="full">full (descarga y calcula)</option>
            <option value="metadata">metadata (rápido)</option>
          </select>
        </label>
        <label>Umbral imagen
          <input type="number" id="op-umbral-img" value="95" min="0" max="100">
        </label>
        <label class="check"><input type="checkbox" id="op-skip"> Solo exactos</label>
      </div>
      <label>Nombre base del reporte (opcional)
        <input type="text" id="op-report" placeholder="reports/latest/duplicados">
      </label>
      <div class="fila">
        <button id="btn-escanear" class="primario">▶ Escanear</button>
        <button id="btn-cancelar" class="peligro" disabled>■ Cancelar</button>
      </div>
      <h3>Autenticación</h3>
      <div class="fila">
        <button class="btn-auth" data-prov="google-drive">Google Drive</button>
        <button class="btn-auth" data-prov="google-photos">Google Photos</button>
        <button class="btn-auth" data-prov="onedrive">OneDrive</button>
      </div>
    </section>
    <section class="panel-log">
      <h2>Registro</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <!-- Visor ampliado -->
  <div id="lightbox" class="lightbox" hidden><img id="lightbox-img" alt=""></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
